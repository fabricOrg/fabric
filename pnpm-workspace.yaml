# pnpm workspaces = a monorepo: many packages, one install, shared tooling.
# WHY a monorepo: the platform is ONE codebase with clear internal modules (see
# MODULE-DECOMPOSITION.md). Workspaces let `packages/*` depend on each other with full
# type-safety and no publishing, while keeping boundaries explicit — maintainability.
packages:
  - "packages/*" # shared libraries (db, types, config, fe-auth, ui, ...)
  - "services/*" # deployable backend apps (api, workers, admin-api) — added in B4
  - "apps/*"
    # deployable Next.js surfaces (dashboard = customer, admin-console = staff) — PI-2 build.
    # dev-portal retired in PI-6 (its developer surfaces merged into the dashboard).
    # See team/frontend/PROPOSAL-fe-auth-bff-seam.md §1.
# Build-script approval (pnpm 11: `allowBuilds` replaces `onlyBuiltDependencies`). pnpm blocks
# lifecycle scripts by default (supply-chain hygiene) and lists unapproved ones here for review.
# Listing a package (true OR false) clears ERR_PNPM_IGNORED_BUILDS; unlisted ones re-trigger it.
allowBuilds:
  esbuild: true # required — esbuild's postinstall fetches its platform binary; without it, builds fail
  sharp: true # Next.js image optimizer native binary; without it `next build` deps-check fails
  '@infisical/cli': false # deferred: build/bin linking is broken on Windows and we don't use the CLI yet
  '@nestjs/core': false # NestJS core's postinstall is a support/telemetry banner — not needed for the build
  msgpackr-extract: false # bullmq → msgpackr optional native ext; pure-JS fallback is fine, skip the build script
