# Render Blueprint — Fabric API on the free tier (stakeholder testing).
# AWS account suspended 2026-07-18; this is the interim hosting path. The AWS pipeline
# (deploy.yml → ECS) remains the production design and resumes on reactivation.
#
# Free-tier realities: the service SLEEPS after ~15 min idle (first request wakes it in
# 30–60s) and gets 512MB RAM. Fine for stakeholder testing; never for customer traffic.
#
# Secrets (sync: false) are set once in the Render dashboard — values come from Infisical.
# Never commit values. Redlines hold: SMS_PROVIDER=fake, sk_test_ keys only.
services:
  - type: web
    name: fabric-api
    runtime: node
    plan: free
    region: frankfurt # closest free region to eu-west-1/WorkOS Staging
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @app/api... build
    startCommand: node services/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Neon connection strings (one Neon project, four roles — see docs/DEPLOY-FREE-TIER.md).
      - key: DATABASE_URL_APP
        sync: false
      - key: DATABASE_URL_PROVISIONER
        sync: false
      # Auth + BFF seam
      - key: BFF_INTERNAL_TOKEN
        sync: false
      - key: TENANT_TOKEN_SECRET
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      # PII vault key material (index/data keys derive from the one master key)
      - key: PII_MASTER_KEY
        sync: false
      # Wraps every per-credential DEK (ADR-0011 §1). REQUIRED here: NODE_ENV=production makes
      # derivePluginMasterKey throw rather than fall back to the development key, so without it every
      # plugin credential write and every live resolve 500s.
      #
      # Set it ONCE and never rotate it casually — a credential sealed under one master key cannot be
      # opened under another, and the failure surfaces at dispatch, not at save. Must be >=32 chars.
      - key: PLUGIN_MASTER_KEY
        sync: false
      # Providers stay sandboxed (redline)
      - key: SMS_PROVIDER
        value: fake
      # Browser origins allowed to read /v1/public/* (the published rate card). Comma-separated
      # exact origins; unset = no browser may read it, so the landing page's pricing section goes
      # empty — fail closed, and visibly.
      #
      # ONLY the marketing site belongs here: it is the sole browser-side caller of that endpoint
      # (apps/www/src/pages/index.astro). The dashboard and admin console reach pricing through
      # their own server-side BFF routes, so listing them would grant cross-origin reads to origins
      # that never ask — which is what an allowlist exists to avoid.
      #
      # NOTE: this file does NOT retro-apply. deploy-testing.yml triggers Render via
      # RENDER_API_SERVICE_ID (a deploy hook), and render.yaml is only read on a blueprint sync, so
      # an already-provisioned service ignores anything added here. Set it on the service (or a
      # linked environment group) as well.
      - key: PUBLIC_CORS_ALLOWED_ORIGINS
        value: https://www-kohl-kappa.vercel.app
      # No Redis on the free stack — the engine's inline dispatch fallback is the design.
      # REDIS_QUEUE_URL intentionally unset.
