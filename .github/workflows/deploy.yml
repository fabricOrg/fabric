name: Deploy

on:
  push:
    branches:
      - testing
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - testing
          - staging
          - production

permissions:
  contents: read
  id-token: write

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify deployment change
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Manual deployment requested."
          else
            node scripts/git/run-verified.mjs --classify
          fi

  deploy-testing:
    needs: classify
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      (github.ref_name == 'testing' || inputs.environment == 'testing') &&
      vars.TESTING_DEPLOYMENTS_ENABLED == 'true'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: testing
      build-image: true
    secrets: inherit

  deploy-staging:
    needs: classify
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      (github.ref_name == 'staging' || inputs.environment == 'staging') &&
      vars.STAGING_DEPLOYMENTS_ENABLED == 'true'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: staging
      build-image: false
    secrets: inherit

  deploy-production:
    needs: classify
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      (github.ref_name == 'main' || inputs.environment == 'production') &&
      vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: production
      build-image: false
    secrets: inherit

  # Dashboard: same trigger/gating as the api jobs above (one *_DEPLOYMENTS_ENABLED var per
  # environment covers both services in that account). Separate GitHub Environment per service
  # (own vars/secrets/OIDC trust) since ECR_REPOSITORY/ECS_SERVICE/etc. differ. Shares the api's
  # database, so run-migration is false.
  deploy-dashboard-testing:
    needs: classify
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      (github.ref_name == 'testing' || inputs.environment == 'testing') &&
      vars.TESTING_DEPLOYMENTS_ENABLED == 'true'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: testing-dashboard
      build-image: true
      dockerfile: apps/dashboard/Dockerfile
      run-migration: false
      smoke-test-path: /login
    secrets: inherit

  deploy-dashboard-staging:
    needs: classify
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      (github.ref_name == 'staging' || inputs.environment == 'staging') &&
      vars.STAGING_DEPLOYMENTS_ENABLED == 'true'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: staging-dashboard
      build-image: false
      dockerfile: apps/dashboard/Dockerfile
      run-migration: false
      smoke-test-path: /login
    secrets: inherit

  deploy-dashboard-production:
    needs: classify
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      (github.ref_name == 'main' || inputs.environment == 'production') &&
      vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: production-dashboard
      build-image: false
      dockerfile: apps/dashboard/Dockerfile
      run-migration: false
      smoke-test-path: /login
    secrets: inherit

  # admin-console: same pattern as the dashboard jobs - own GitHub Environment (own vars/secrets/OIDC
  # trust); shares the api's database so run-migration is false. Testing only for now (staging/
  # production wired later, mirroring the dashboard jobs). (dev-portal retired in PI-6.)
  deploy-admin-console-testing:
    needs: classify
    if: >-
      needs.classify.outputs.docs_only != 'true' &&
      (github.ref_name == 'testing' || inputs.environment == 'testing') &&
      vars.TESTING_DEPLOYMENTS_ENABLED == 'true'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: testing-admin-console
      build-image: true
      dockerfile: apps/admin-console/Dockerfile
      run-migration: false
      smoke-test-path: /login
    secrets: inherit
