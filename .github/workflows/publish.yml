name: Publish packages

# Publishes @fabric-messaging/sdk and @fabric-messaging/cli to the public npm registry.
# DELIBERATE, never on a plain push:
#   - a GitHub Release whose tag is `sdk-v*` / `cli-v*` (cut a release to publish that package), or
#   - a manual workflow_dispatch (pick the package).
# Uses npm PROVENANCE via OIDC trusted publishing — no long-lived NPM token is stored. Enable
# trusted publishing for each package on npmjs.com (Package settings → Trusted publishers → this
# repo + this workflow) before the first run. Until then a publish attempt fails closed (no token).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - sdk
          - cli

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.package }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm provenance / OIDC trusted publishing

jobs:
  resolve:
    name: Resolve target package
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      package: ${{ steps.pick.outputs.package }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_PKG: ${{ inputs.package }}
        shell: bash
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "package=$INPUT_PKG" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == sdk-v* ]]; then
            echo "package=sdk" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == cli-v* ]]; then
            echo "package=cli" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release tag '$TAG' is not sdk-v*/cli-v* — nothing to publish." && exit 1
          fi

  publish:
    name: Publish ${{ needs.resolve.outputs.package }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the npm trusted-publisher binding (configured on npmjs for publish.yml → the
    # `testing` GitHub Environment). The OIDC token's environment claim has to line up or npm
    # rejects the trusted publish.
    environment: testing
    permissions:
      contents: read
      id-token: write
    env:
      # sdk → packages/sdk (@fabric-messaging/sdk); cli → packages/cli (@fabric-messaging/cli).
      PKG_DIR: packages/${{ needs.resolve.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing (minting short-lived creds from the id-token, no NODE_AUTH_TOKEN)
      # requires npm >= 11.5.1; Node 22 ships npm 10.x, which ignores the OIDC flow and publishes
      # unauthenticated — npm then masks the auth failure as an E404 on the package PUT.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      # release:check runs tsc over specs that import the @app/contracts workspace package, whose
      # types come from its build output — build the shared libs first (same as the main verify),
      # or typecheck fails with "Cannot find module '@app/contracts'".
      - name: Build workspace dependencies
        run: pnpm build:shared

      - name: Release check (build + typecheck + tests + pack smoke)
        working-directory: ${{ env.PKG_DIR }}
        run: pnpm release:check

      - name: Publish (provenance via OIDC trusted publishing)
        working-directory: ${{ env.PKG_DIR }}
        # No NODE_AUTH_TOKEN: trusted publishing mints short-lived credentials from the OIDC id-token.
        # --provenance attaches a signed build-provenance attestation. publishConfig.access is "public".
        #
        # --tag latest, deliberately, and the previous comment here was wrong about why. It claimed
        # `--tag beta` keeps a prerelease from becoming `latest`. npm pins `latest` on a package's
        # FIRST publish whatever tag is passed, so both packages have pointed `latest` at a
        # prerelease from the beginning and no publish since moved it:
        #
        # Measured with `npm dist-tag ls` on 2026-09-06 — BOTH packages read:
        #
        #   sdk  latest=0.1.0-beta.8  beta=0.1.0-beta.8
        #   cli  latest=0.1.0-beta.8  beta=0.1.0-beta.8
        #
        # An earlier revision of this comment recorded sdk beta=0.1.0-beta.7 and cli latest=beta.1.
        # Do not reason from these numbers: a comment cannot track a registry, and this one was
        # stale enough that two reviews built a wrong conclusion on it. Run `npm dist-tag ls`.
        # What the numbers are here to show is the SHAPE: `latest` points at a prerelease, and a
        # publish moves `latest` only.
        #
        # `latest` is what a plain `npm install` resolves, so the effect was that every consumer got
        # a build nobody intended to ship — for the SDK, one whose default endpoint no longer
        # resolves in DNS. Moving `latest` after the fact needs `npm dist-tag`, which OIDC trusted
        # publishing does not mint credentials for, so it cannot be a follow-up step here without
        # reintroducing a long-lived token.
        #
        # Since `latest` already points at a prerelease for both packages and there is no stable
        # release to protect, pointing it at the NEWEST prerelease is strictly better than leaving it
        # on the oldest. Revisit when 1.0 ships and `latest` should track stable only.
        run: npm publish --provenance --access public --tag latest
