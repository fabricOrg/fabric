name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - develop
      - main
      - staging
      - testing

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_OWNER: postgresql://app_migrator:localdev@localhost:5432/app
      DATABASE_URL_APP: postgresql://app_runtime:localdev_app@localhost:5432/app
      # CI uses the owner role for the provisioner path, matching .env.example. Cloud runtimes use
      # the dedicated app_provisioner credential from Secrets Manager.
      DATABASE_URL_PROVISIONER: postgresql://app_owner:localdev@localhost:5432/app
      DATABASE_URL_SUPER: postgresql://app_owner:localdev@localhost:5432/app

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Classify changes
        id: changes
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/git/run-verified.mjs --classify

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Start local infrastructure
        if: steps.changes.outputs.docs_only != 'true'
        run: docker compose up -d --wait

      - name: Verify workspace
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm verify:full

      - name: Skip verification for documentation-only change
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Only Markdown documentation changed; build and test verification skipped."

      - name: Show container logs on failure
        if: failure() && steps.changes.outputs.docs_only != 'true'
        run: docker compose logs --no-color

      - name: Stop local infrastructure
        if: always() && steps.changes.outputs.docs_only != 'true'
        run: docker compose down
