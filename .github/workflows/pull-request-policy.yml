name: Pull Request Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate branch name
        run: node scripts/git/validate-branch-name.mjs

      - name: Validate promotion path
        run: node scripts/git/validate-pr-flow.mjs

      - name: Validate pull-request title
        run: node scripts/git/validate-commit-message.mjs "$PR_TITLE"

      # CLAUDE.md §5 is a HARD gate, and it was still skipped twice — the rule and the template
      # checkbox both existed, but `gh pr create --body-file` replaces the template, so nothing ever
      # asked. This asks.
      - name: Validate independent review
        run: node scripts/git/validate-review-attestation.mjs
