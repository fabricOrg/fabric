name: Bug report
description: Report reproducible incorrect behavior
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the exact error or incorrect state?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic sequence that reproduces the problem.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk area
      options:
        - General
        - Authentication or authorization
        - Tenant isolation
        - Wallet or ledger
        - SMS delivery
        - PII or compliance
        - Deployment or infrastructure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Branch or commit, operating system, Node version, and relevant service versions.
    validations:
      required: true
