name: Feature request
description: Propose a measurable product or engineering outcome
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what prevents them from succeeding today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable conditions.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and dependencies
      description: Include security, money, tenant, compliance, provider, and rollout considerations.
